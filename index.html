<!DOCTYPE html>

  footer {
    text-align: center;
    padding: 30px;
    border-top: 1px solid rgba(0,255,120,0.2);
    color: #8effc7;
  }

  @media (max-width: 700px) {
    header h1 {
      font-size: 3rem;
    }
  }
  </style>
</head>
<body>

<div class="scanlines"></div>

<div class="radar-bg">
  <iframe
    src="https://tenor.com/embed/20027720"
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>

<header>
  <h1>F1SECRET</h1>
  <p>TOP SECRET GAMING NETWORK</p>
</header>

<section class="topbar">
  <input type="text" id="search" placeholder="SEARCH DATABASE...">
  <button onclick="randomGame()">RANDOM DEPLOYMENT</button>
</section>

<section class="categories">
  <button>HOT ZONES</button>
  <button>RACING</button>
  <button>ACTION</button>
  <button>RETRO</button>
  <button>FLIGHT</button>
  <button>MULTIPLAYER</button>
</section>

<section class="games-grid" id="gamesGrid">

  <a class="game-card" href="games/minecraft.html">
    <img src="https://picsum.photos/300/200?1">
    <h3>Minecraft</h3>
  </a>

  <a class="game-card" href="games/sm64.html">
    <img src="https://picsum.photos/300/200?2">
    <h3>SM64</h3>
  </a>

  <a class="game-card" href="games/racing.html">
    <img src="https://picsum.photos/300/200?3">
    <h3>Cyber Racing</h3>
  </a>

</section>

<footer>
  <p>F1SECRET CLASSIFIED TERMINAL</p>
</footer>

<script>
const searchInput = document.getElementById("search");
const cards = document.querySelectorAll(".game-card");

searchInput.addEventListener("keyup", () => {
  const value = searchInput.value.toLowerCase();

  cards.forEach(card => {
    const title = card.innerText.toLowerCase();

    if(title.includes(value)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
});

function randomGame() {
  const games = Array.from(cards);
  const random = games[Math.floor(Math.random() * games.length)];

  window.location.href = random.href;
}
</script>


</body>
</html>
