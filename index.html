<!DOCTYPE html>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #050505;
    color: #00ff88;
    font-family: 'Orbitron', sans-serif;
    overflow-x: hidden;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      transparent 0px,
      rgba(0,255,100,0.04) 2px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  .radar-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    opacity: 0.13;
    overflow: hidden;
  }

  .radar-bg iframe {
    width: 100vw !important;
    height: 100vh !important;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(0,255,100,0.08), transparent 60%),
      linear-gradient(rgba(0,255,100,0.03), rgba(0,255,100,0.01));
    z-index: -1;
  }

  header {
    text-align: center;
    padding: 50px 20px 30px;
  }

  header h1 {
    font-size: 5rem;
    font-weight: 800;
    text-shadow:
      0 0 10px #00ff88,
      0 0 30px #00ff88;
    letter-spacing: 6px;
  }

  header p {
    margin-top: 10px;
    color: #8effc7;
    letter-spacing: 3px;
  }

  .topbar {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px;
    flex-wrap: wrap;
  }

  .topbar input {
    width: 350px;
    max-width: 90%;
    padding: 15px;
    border: 2px solid #00ff88;
    background: rgba(0,0,0,0.8);
    color: #00ff88;
    border-radius: 10px;
    font-family: inherit;
  }

  .topbar button,
  .categories button,
  .featured-info a {
    padding: 14px 22px;
    background: rgba(0,255,120,0.08);
    border: 2px solid #00ff88;
    color: #00ff88;
    border-radius: 10px;
    font-family: inherit;
    cursor: pointer;
    transition: 0.25s;
    text-decoration: none;
  }

  .topbar button:hover,
</html>
